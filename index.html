<style>

<style>
input[type=range]
{
appearance:none;
width:100%;
height:7px;
border-radius:999px;
outline:none;
border:none;
background:linear-gradient(
to right,
var(--range-fill) 0%,
var(--range-track) 0%
);
}

input[type=range]::-webkit-slider-thumb
{
appearance:none;
width:10px;
height:20px;
background:var(--range-fill);
border-radius:20px;
box-shadow:0 0 0 5px var(--range-cut);
background-clip:padding-box;
cursor:pointer;
}

input[type=range]::-moz-range-thumb
{
width:10px;
height:20px;
background:var(--range-fill);
border-radius:20px;
box-shadow:0 0 0 5px var(--range-cut);
background-clip:padding-box;
cursor:pointer;
}
</style>
<style>
/* switch base */
input[type=checkbox][switch]
{
appearance:none;
-webkit-appearance:none;
cursor:pointer;
transition:all .25s ease;
width:40px;
height:20px;
min-width:45px;
border-radius:var(--bdr,999px);
background:var(--switch-track);
position:relative;
}

input[type=checkbox][switch]::before
{
content:'';
position:absolute;
top:0px;
left:0;
width:20px;
height:20px;
border-radius:inherit;
background:var(--switch-knob);
transition:all .25s ease;
box-shadow:0 0 0 4px var(--switch-cut);
}

/* checked state */
input[type=checkbox][switch]:checked
{
background:var(--switch-fill);
}

input[type=checkbox][switch]:checked::before
{
left:24px;
}

/* locked */
input[type=checkbox][switch][lock]
{
pointer-events:none;
opacity:.6;
}

/* theme variables */
[rt]{--switch-track:#9b4256;--switch-fill:#ffcdd2;--switch-knob:#ffcdd2;--switch-cut:#512230;}
[bt]{--switch-track:#484d72;--switch-fill:#bbdefb;--switch-knob:#bbdefb;--switch-cut:#262a47;}
[yt]{--switch-track:#bf7442;--switch-fill:#f4dba4;--switch-knob:#f4dba4;--switch-cut:#563923;}
[gt]{--switch-track:#3c6d46;--switch-fill:#c8e6c9;--switch-knob:#c8e6c9;--switch-cut:#213225;}
</style>

<script>
const paint
= _0 =>
{
const el = _0.target
const min = el.min
const max = el.max
const val = el.value
const pct = (val - min) * 100 / (max - min)

el.style.background
= `linear-gradient(to right,
var(--range-fill) ${pct}%,
var(--range-track) ${pct}%)`
}

document
.querySelectorAll('input[type=range]')
.forEach
(
_0 =>
{
paint({target:_0})
_0.addEventListener('input',paint)
}
)
</script>
