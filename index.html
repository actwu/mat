<style>
* {font-family: "Roboto", sans-serif; border:unset; outline:unset; box-sizing:border-box;}
body {

  font-optical-sizing: auto;
  font-weight: 200;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;

  
  padding:20px;
  margin:0 auto;
  max-width:720px;
  background:#0b0c16;

  display:flex; flex-direction: column;
  color:#f2f2ff;

p {font-weight:400;}

h1,h2,h3,p {display:inline-flex;margin:0;}
h1 {font-weight:500;letter-spacing:-1px;font-size:40px;}
h2 {font-weight:400;letter-spacing:-1px;font-size:28px;}
h3 {font-weight:400;letter-spacing:-1px;font-size:20px;}

/* container */
cont {
  display:flex;
  flex-direction: column;
  gap:10px;
  margin-bottom:20px;
  padding:10px;
  border-radius:8px;
}
span, span * {display:flex; flex-wrap:wrap; gap:10px;}

/* base btn */
btn {
  display:inline-flex;
  align-items:center;
  font-weight:600;
  padding:12px 16px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  user-select:none;
  transition:all 0.2s;
}

/* child spacing */
btn > * { font-weight:500; }

/* THEMES */
::placeholder { opacity:80%; color:#f2f2ff; }
:hover::placeholder { opacity:100%; color:#f2f2ff; }

/* RED */
[r] { background:#ffcdd2; color:#b71c1c; }
[r] > * { filter: brightness(0) saturate(80%) invert(22%) sepia(89%) saturate(2100%) hue-rotate(330deg) brightness(80%) contrast(70%); }
[r2] { background:#822035; color:#ffcdd2; }
[r2] > * { filter: brightness(0) saturate(90%) invert(80%) sepia(40%) saturate(12%) hue-rotate(110deg) brightness(10) contrast(80%); }

/* BLUE */
[b] { background:#bbdefb; color:#0d47a1; }

[b2] { background:#233f70; color:#bbdefb; }
[b2] > * { filter: brightness(0) saturate(100%) invert(58%) sepia(99%) saturate(30) hue-rotate(204deg) brightness(155%) contrast(90%); }

/* YELLOW */
[y] { background:#f4dba4; color:#ad5318; }

[y2] { background:#995d2c; color:#fff3e0;}
[y] > * { filter: invert(58%) sepia(120%) saturate(920%) hue-rotate(4deg) brightness(90%) contrast(90%); }

/* GREEN */

[g2] { background:#2c7249; color:#c8e6c9; }
[g2] > * { filter: invert(1%) sepia(180%) saturate(110%) hue-rotate(89deg) brightness(98%) contrast(90%); }

/* Dark-themed containers */
[rt] { background:#512230; color:#fff; padding:12px; border-radius:12px; }
[rt] textarea {background:#9b4256;}    
[bt] { background:#262a47; color:#fff; padding:12px; border-radius:12px; }
[bt] textarea {background:#484d72;}    
[yt] { background:#563923; color:#fff; padding:12px; border-radius:12px; }

[gt] { background:#213225; color:#fff; padding:12px; border-radius:12px; }
[gt] textarea {background:#3c6d46;}    

/* Textareas */
textarea {
  font-family:sans-serif;
  font-size:16px;
  padding:12px 14px;
  border-radius:8px;
  flex:1;
  background:#2b2b2b;
  color:#fff;
  outline:none;
  transition:border 0.2s, box-shadow 0.2s, background 0.2s;
  resize:vertical;
  min-height:200px;
}



/* RED THEME RANGE */
[rt] input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 6px;
  background: #9b4256;
  outline: none;
}
[rt] input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
[rt] input[type=range]:hover::-webkit-slider-thumb {
  transform: scale(1.1);
}
